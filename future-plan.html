<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Fred & Fred Agro Engineers Limited - Agricultural Engineering for Rural Development"
    >

    <meta
        name="theme-color"
        content="#062b4d"
    >

    <title>
        Fred & Fred Agro Engineers Limited | Home
    </title>

    <link
        rel="stylesheet"
        href="css/main.css"
    >

</head>


<body>


    <!-- =========================================================
         NAVBAR
    ========================================================== -->

    <header
        class="site-header"
        id="siteHeader"
    >

        <div class="navbar-container">


            <!-- LOGO -->

            <a
                href="index.html"
                class="logo-link"
                aria-label="Fred & Fred Agro Engineers Limited"
            >

                <img
                    src="assets/Screenshot (311) Logo.png"
                    alt="Fred & Fred Agro Engineers Limited"
                    class="navbar-logo"
                >

            </a>


            <!-- NAVIGATION -->

            <nav
                class="site-nav"
                id="siteNav"
                aria-label="Main Navigation"
            >

                <a
                    href="index.html"
                    class="nav-link"
                >
                    Home
                </a>

                <a
                    href="about.html"
                    class="nav-link"
                >
                    About Us
                </a>

                <a
                    href="fsb-solution.html"
                    class="nav-link"
                >
                    FSB Solution
                </a>

                <a
                    href="equipment-matrix.html"
                    class="nav-link"
                >
                    FSB Equipment Matrix
                </a>
                
                <a
                    href="promoters-pedigree.html"
                    class="nav-link"
                >
                    Promoters' Pedigree
                </a>
                
                <a
                    href="future-plan.html"
                    class="nav-link active"
                >
                    Future Plan
                </a>


            </nav>


            <!-- HAMBURGER -->

            <button
                class="navbar-toggle"
                id="menuToggle"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
                aria-controls="siteNav"
            >

                <span class="bar"></span>

                <span class="bar"></span>

                <span class="bar"></span>

            </button>


        </div>

    </header>



    <!-- =========================================================
         MAIN
    ========================================================== -->

    <main>


        <!-- HERO -->

        <section class="hero-section">


            <div class="hero-glow"></div>

            <div class="hero-ring hero-ring-one"></div>

            <div class="hero-ring hero-ring-two"></div>


            <div class="hero-container">


                <!-- TITLE -->

                <div class="hero-title reveal">

                    <h1>

                        <span>
                            STILL UNDER DEVELOPMENT
                        </span>


                        <span class="title-second-line">

                            <em>
                                for
                            </em>

                            <strong>
                                RURAL DEVELOPMENT
                            </strong>

                        </span>

                    </h1>

                </div>


                <!-- LOGO -->

                <div class="hero-logo reveal">

                    <img
                        src="assets/Screenshot (311) Logo.png"
                        alt="Fred & Fred Agro Engineers Limited"
                    >

                </div>


                <!-- MAP -->

                <div class="map-area reveal">

                    <div class="map-halo"></div>

                    <img
                        src="assets/Screenshot__311__Homepage-removebg-preview.png"
                        alt="Map of Nigeria representing Home Grown Knowledge"
                        class="nigeria-map"
                    >


                    <div class="knowledge-message">

                        <div class="knowledge-green">
                            Home Grown
                        </div>

                        <div class="knowledge-script">
                            Knowledge
                        </div>

                    </div>

                </div>

                <br>
                <!-- TAGLINE -->

                <div class="hero-statement reveal">

                    <h2>
                        FARM TECHNIQUE WITH
                    </h2>

                    <h2>
                        AFRICAN SOLUTIONS
                    </h2>

                </div>


            </div>

        </section>

    </main>



    <!-- =========================================================
         FOOTER
    ========================================================== -->

    <footer class="site-footer">

        <div class="footer-container">

            <div class="footer-brand">

                <img
                    src="assets/Screenshot (311) Logo.png"
                    alt="Fred & Fred Agro Engineers Limited"
                >

                <div>

                    <strong>
                        FRED &amp; FRED AGRO ENGINEERS LIMITED
                    </strong>

                    <p>
                        Farm Technique with African Solutions
                    </p>

                </div>

            </div>


            <a
                href="#"
                class="back-top"
                id="backTop"
            >
                Back to top ↑
            </a>

        </div>

    </footer>



    <script src="js/main.js"></script>

</body>

</html>
